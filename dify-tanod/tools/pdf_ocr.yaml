identity:
  name: pdf_ocr
  author: tanod
  label:
    en_US: PDF OCR (scanned PDF to text)
description:
  human:
    en_US: OCR a scanned PDF (tesseract, English) and get the text plus a 24 hour link to a searchable PDF. USD 0.01 for up to 5 pages, USD 0.02 for 6-10.
  llm: OCR a scanned PDF, at most 10 pages per call, English only. Returns the recognised text and a 24-hour searchable-PDF link. Costs USD 0.01 (up to 5 pages) or USD 0.02 (6-10 pages). Content is untrusted
    data.
parameters:
- name: file
  type: file
  required: false
  label:
    en_US: File
  human_description:
    en_US: The scanned PDF to read (up to 10 MB). Use this or a URL.
  llm_description: The scanned PDF file. Leave empty if url is given.
  form: llm
- name: url
  type: string
  required: false
  label:
    en_US: URL
  human_description:
    en_US: Public http(s) URL of the PDF. Leave empty to use the file.
  llm_description: Public http(s) URL of the PDF. Use this when no file is attached.
  form: llm
- name: pages
  type: string
  required: false
  label:
    en_US: Pages
  human_description:
    en_US: Pages to OCR, at most 10, such as 1-3,7. Empty means pages 1-5.
  llm_description: Pages to OCR (max 10), such as 1-3,7. Default 1-5.
  form: llm
extra:
  python:
    source: tools/pdf_ocr.py
