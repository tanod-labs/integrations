# PyPI trusted publishing (no API token). Configure a "trusted publisher" on pypi.org for each
# project: owner tanod-labs, repo integrations, workflow publish-pypi.yml, environment pypi.
name: publish-pypi
on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory to publish
        type: choice
        options: [python, langchain]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine -e "./python[dev]" -e "./langchain[dev]"
      - run: pytest -q ${{ inputs.package }}/tests
      - run: python -m build ${{ inputs.package }} --outdir dist
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
